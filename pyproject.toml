[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-parametric-studio"
version = "0.1.1"
description = "The PSN custom nodes from Parametric Studio, a local studio for open-weights image, video and music models on ComfyUI. The studio app itself installs from the GitHub repository (INSTALL.md)."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
classifiers = [
    "Operating System :: OS Independent",
    "Environment :: GPU :: NVIDIA CUDA",
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic",
    "numpy",
    "pillow",
    "brotli",
    "apscheduler",
    "huggingface_hub[hf_xet]",
]

[project.optional-dependencies]
test = ["pytest", "pytest-xdist", "pytest-timeout", "httpx"]
sdk = ["comfy-sdk>=0.5"]
nodes = ["torch", "cryptography"]

[project.urls]
Repository = "https://github.com/parametricparadigm/ComfyUI_Parametric_Studio"
Documentation = "https://github.com/parametricparadigm/ComfyUI_Parametric_Studio/blob/main/INSTALL.md"
"Bug Tracker" = "https://github.com/parametricparadigm/ComfyUI_Parametric_Studio/issues"
Homepage = "https://parametricparadigm.github.io/ComfyUI_Parametric_Studio/"
Licence = "https://www.gnu.org/licenses/agpl-3.0.html"

# This repository runs from a checkout (python -m studio.server, or as a ComfyUI custom node folder).
# It is not published as a wheel, so no packages are declared here.
[tool.setuptools]
packages = []

[tool.comfy]
PublisherId = "parametricparadigm"
DisplayName = "Parametric Studio"
Icon = "https://raw.githubusercontent.com/parametricparadigm/ComfyUI_Parametric_Studio/main/docs/img/registry-icon.png"
Banner = "https://raw.githubusercontent.com/parametricparadigm/ComfyUI_Parametric_Studio/main/docs/img/registry-banner.jpg"

[tool.uv]
package = false
