# Parametric Studio's own job for FLUX.1 [dev] on ai-toolkit. Written for this page; the double-brace names are filled in by studio/trainers/aitoolkit.py.
job: extension
config:
  name: "{{name}}"
  process:
    - type: sd_trainer
      training_folder: "{{run_dir}}"
      device: cuda:0
      trigger_word: "{{trigger}}"
      network: {type: lora, linear: {{rank}}, linear_alpha: {{rank}}}
      save: {dtype: float16, save_every: {{save_every}}, max_step_saves_to_keep: 2}
      datasets:
        - folder_path: "{{dataset}}"
          caption_ext: txt
          caption_dropout_rate: 0.05
          cache_latents_to_disk: true
          resolution: [{{size}}]
      train:
        batch_size: {{batch}}
        steps: {{steps}}
        gradient_accumulation_steps: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: flowmatch
        optimizer: adamw8bit
        lr: {{lr}}
        dtype: bf16
        seed: {{seed}}
      model: {name_or_path: "{{pipeline}}", is_flux: true, quantize: true}
      sample:
        sampler: flowmatch
        sample_every: {{sample_every}}
        width: {{size}}
        height: {{size}}
        prompts: ["{{prompt}}"]
        neg: ""
        seed: 42
        walk_seed: false
        guidance_scale: {{guidance}}
        sample_steps: {{sample_steps}}
meta: {name: "{{name}}", version: "1.0"}
